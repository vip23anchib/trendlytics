version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=production-secret-trendlytics-key
      - DEBUG=False
      - DB_ENGINE=sqlite
      - PORT=8000
    volumes:
      - ./backend/db.sqlite3:/app/backend/db.sqlite3
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped
